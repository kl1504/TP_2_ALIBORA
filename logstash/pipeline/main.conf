input {
  beats {
    port => 5044
  }
}

filter {
  # 1. Timestamp standardization
  # Forces Logstash to use the actual event time instead of the ingestion time
  if [log][file][path] or [timestamp] {
    date {
      match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss.SSS", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
      timezone => "UTC"
    }
  }

  # 2. Noise reduction (Drop useless logs)
  # Drops empty lines or repetitive healthcheck/ping messages to save disk space
  if [message] =~ /^\s*$/ or [message] =~ /[Hh]ealthcheck|ping/ {
    drop { }
  }

  # 3. Sensitive data masking (Compliance / Security)
  # Automatically masks passwords or tokens if they accidentally leak into the logs
  if [message] =~ /[Pp]assword|[Tt]oken|[Se]cret/ {
    mutate {
      gsub => [
        "message", "password=[^&\s]+", "password=XXXXX",
        "message", "token=[^&\s]+", "token=XXXXX"
      ]
    }
  }

  # 4. Structure unification (ECS - Elastic Common Schema)
  # Standardizes core system fields so your Kibana dashboards work seamlessly across all hosts
  mutate {
    lowercase => [ "[agent][hostname]", "[log][level]" ]
    rename => { "host" => "[host][name]" }
    remove_field => [ "prospector", "input", "migration_id" ] # Removes redundant Filebeat metadata
  }

  # 5. Universal Error Handling
  # Flags the log if any future parsing (Grok/JSON) fails further down the pipeline
  if "_grokparsefailure" in [tags] or "_jsonparsefailure" in [tags] {
    mutate {
      add_field => { "[log][status]" => "malformed" }
    }
  } else {
    mutate {
      add_field => { "[log][status]" => "success" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][beat]}-%{[@metadata][version]}-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }
}