global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'a.kaelh01@gmail.com'
  smtp_auth_username: 'a.kaelh01@gmail.com'
  smtp_auth_password_file: /etc/alertmanager/smtp_password
  smtp_require_tls: true

route:
  group_by: ['alertname', 'instance', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'

  routes:
    # Alertes critiques securite vers boite mail Securite Critique
    - match:
        severity: critical
        team: security
      receiver: 'mail-security-critical'
      repeat_interval: 1h

    # Alertes warning securite vers boite mail Securite Standard
    - match:
        severity: warning
        team: security
      receiver: 'mail-security-warning'
      repeat_interval: 6h

    # Alertes ops critiques vers boite mail Astreinte Ops
    - match:
        severity: critical
        team: ops
      receiver: 'mail-ops-critical'
      repeat_interval: 2h

receivers:
  # Destinataire par defaut si aucun filtre ne correspond
  - name: 'default-receiver'
    email_configs:
      - to: 'a.kaelh01@gmail.com'
        send_resolved: true

  # Canal Securite Critique (Email formaté)
  - name: 'mail-security-critical'
    email_configs:
      - to: 'a.kaelh01@gmail.com'
        send_resolved: true
        headers:
          subject: 'CRITICAL ALERT: {{ .GroupLabels.alertname }}'
        html: |
          <h3>ALERTE SÉCURITÉ CRITIQUE</h3>
          {{ range .Alerts }}
            <p><strong>Instance :</strong> {{ .Labels.instance }}</p>
            <p><strong>Description :</strong> {{ .Annotations.description }}</p>
            <hr/>
          {{ end }}

  # Canal Securite Warning
  - name: 'mail-security-warning'
    email_configs:
      - to: 'a.kaelh01@gmail.com'
        send_resolved: true
        headers:
          subject: 'Warning: {{ .GroupLabels.alertname }}'

  # Canal Ops Critique
  - name: 'mail-ops-critical'
    email_configs:
      - to: 'a.kaelh01@gmail.com'
        send_resolved: true
        headers:
          subject: 'OPS CRITICAL: {{ .GroupLabels.alertname }}'

inhibit_rules:
  - source_match:
      alertname: 'ServiceDown'
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['instance']

  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
