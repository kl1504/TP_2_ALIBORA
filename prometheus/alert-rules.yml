groups:
  - name: node_alerts
    rules:
      - alert: HighCpuLoad
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100) > 10
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High CPU load on {{ $labels.instance }}"
          description: "CPU load is > 10% (current value: {{ $value }}%)"

  - name: disk_alerts
    rules:
      - alert: DiskSpaceHigh
        expr: >
          (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
               / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk Space high on {{ $labels.instance }}"
          description: "The disk {{ $labels.mountpoint }} exceeds 95% of uses."

  - name: availability_alerts
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Instance {{ $labels.instance }} unavailable"
          description: "{{ $labels.instance }} (job {{ $labels.job }}) is not responding since 1m."

      - alert: ProbeFailed
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
          team: ops
        annotations:
          summary: "Sensor failure : {{ $labels.instance }}"
          description: "Blackbox Sensor {{ $labels.instance }} fail since 1m."

      - alert: SslCertExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 5m
        labels:
          severity: warning
          team: security
        annotations:
          summary: "TLS Certificate expiring soon : {{ $labels.instance }}"
          description: "The certificate expires {{ $value | printf \"%.0f\" }} in days."
